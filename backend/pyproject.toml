[project]
name = "business-disruption-backend"
version = "0.1.0"
description = "Business Disruption Early-Warning System Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "networkx>=3.2.1",
    "tavily-python>=0.3.0",
    "openai>=1.14.0",
    "anthropic>=0.19.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    "rapidfuzz>=3.6.0",
    "httpx>=0.27.0",
    "scikit-learn>=1.9.1",
    "joblib>=1.6.0",
    "numpy>=2.4.6",
    "pandas>=3.0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
